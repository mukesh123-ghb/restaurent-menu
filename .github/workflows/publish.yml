name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A4DE51: ${{ secrets.A4DE51 }}
          BDF7AA: ${{ secrets.BDF7AA }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A4DE51', '')
          meta_b = os.environ.get('BDF7AA', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- d1312e95d3625677d891c1d903f9eba23a79683e37b24f71 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 8b82ef158d4147427c110d102621da13a453 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
